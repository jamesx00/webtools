<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Encode / Decode — Webtools</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body>
    <div class="app">
      <a class="back-link" href="../">&larr; Webtools</a>
      <header class="header">
        <h1>Encode / Decode</h1>
        <p class="subtitle">Base64, URL encoding, and JSON formatting for text you paste in — nothing leaves your browser.</p>
      </header>

      <div class="tabs" id="tabs" role="tablist">
        <button class="tab" data-mode="base64" role="tab" aria-selected="true">Base64</button>
        <button class="tab" data-mode="url" role="tab" aria-selected="false">URL</button>
        <button class="tab" data-mode="json" role="tab" aria-selected="false">JSON</button>
      </div>

      <section class="panel">
        <div class="field">
          <div class="field__head">
            <label for="input" class="control-label">Input</label>
          </div>
          <textarea id="input" class="textarea" rows="8" placeholder="Paste text here&hellip;"></textarea>
        </div>

        <div class="actions" id="actions"></div>

        <div class="field">
          <div class="field__head">
            <label for="output" class="control-label">Output</label>
            <button class="btn btn--secondary btn--sm" id="copyBtn">Copy</button>
          </div>
          <textarea id="output" class="textarea" rows="8" readonly placeholder="Result appears here&hellip;"></textarea>
          <p class="error" id="error" hidden></p>
        </div>
      </section>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
