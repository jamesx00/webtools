<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>EXIF Viewer — Webtools</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body>
    <div class="app">
      <a class="back-link" href="../">&larr; Webtools</a>
      <header class="header">
        <h1>EXIF Viewer</h1>
        <p class="subtitle">View EXIF metadata embedded in a JPEG — camera, GPS, timestamps — nothing leaves your browser.</p>
      </header>

      <section class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Drop a JPEG here or click to browse">
        <div class="dropzone__inner">
          <svg
            class="dropzone__icon"
            xmlns="http://www.w3.org/2000/svg"
            width="48"
            height="48"
            viewbox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <p class="dropzone__text">Drop a JPEG here or
            <span class="dropzone__browse">browse</span>
          </p>
          <p class="dropzone__hint">Works best with JPEGs &mdash; nothing leaves your browser</p>
        </div>
        <input type="file" id="fileInput" accept="image/jpeg" hidden/>
      </section>

      <section class="result" id="result" hidden>
        <div class="panel">
          <h2 class="section-title">File info</h2>
          <table class="kv-table" id="fileInfoTable"></table>
        </div>

        <div class="panel">
          <h2 class="section-title">EXIF data</h2>
          <p class="status-message" id="exifStatus" hidden></p>
          <table class="kv-table" id="exifTable" hidden></table>
          <p class="gps-line" id="gpsLine" hidden></p>
        </div>

        <div class="actions">
          <button class="btn btn--secondary" id="downloadStripped" hidden>Download stripped copy</button>
        </div>
      </section>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
