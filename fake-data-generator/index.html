<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Fake Data Generator — Webtools</title>
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body>
    <div class="app">
      <a class="back-link" href="../">&larr; Webtools</a>
      <header class="header">
        <h1>Fake Data Generator</h1>
        <p class="subtitle">Generate sample tabular data with the fields you choose — entirely offline.</p>
      </header>

      <section class="panel">
        <div class="field">
          <div class="field__head">
            <label class="control-label">Fields</label>
            <div class="field-select-actions">
              <button class="btn-link" id="fieldsSelectAll" type="button">Select all</button>
              <button class="btn-link" id="fieldsSelectNone" type="button">Select none</button>
            </div>
          </div>
          <div class="field-select-grid" id="fieldSelectGrid"></div>
        </div>

        <div class="field">
          <div class="field__head">
            <label for="fakeRows" class="control-label">Options</label>
          </div>
          <div class="controls-row">
            <input type="number" id="fakeRows" class="number-input" min="1" max="200" value="10"/>
            <button class="btn btn--primary" id="fakeGenerate">Generate</button>
            <button class="btn btn--secondary" id="fakeCopyCsv">Copy as CSV</button>
          </div>
          <p class="error" id="fakeError" hidden>Select at least one field.</p>
        </div>

        <div class="field">
          <div class="field__head">
            <label class="control-label">Output</label>
          </div>
          <div class="table-wrap">
            <table class="data-table" id="fakeTable">
              <thead id="fakeTableHead"></thead>
              <tbody id="fakeTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
