<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Image Resizer — Webtools</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body>
    <div class="app">
      <a class="back-link" href="../">&larr; Webtools</a>
      <header class="header">
        <h1>Image Resizer</h1>
        <p class="subtitle">Resize an image to exact dimensions or a percentage, entirely in your browser.</p>
      </header>

      <section class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Drop an image here or click to browse">
        <div class="dropzone__inner">
          <svg
            class="dropzone__icon"
            xmlns="http://www.w3.org/2000/svg"
            width="48"
            height="48"
            viewbox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/> </svg>
          <p class="dropzone__text">Drop an image here or
            <span class="dropzone__browse">browse</span>
          </p>
          <p class="dropzone__hint">JPEG, PNG and WebP supported</p>
        </div>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden/>
      </section>

      <p class="error" id="errorMsg" hidden></p>

      <section class="workspace" id="workspace" hidden>
        <div class="preview">
          <img class="preview__img" id="sourcePreview" alt="Source image preview"/>
          <div class="preview__meta">
            <span id="sourceName"></span>
            <span id="sourceDims"></span>
            <span id="sourceSize"></span>
          </div>
        </div>

        <section class="controls">
          <div class="control-group">
            <label for="widthInput" class="control-label">Width (px)</label>
            <input type="number" id="widthInput" min="1" class="number-input"/>
          </div>
          <div class="control-group">
            <label for="heightInput" class="control-label">Height (px)</label>
            <input type="number" id="heightInput" min="1" class="number-input"/>
          </div>
          <div class="control-group control-group--inline">
            <label for="lockAspect" class="control-label">Lock aspect ratio</label>
            <input type="checkbox" id="lockAspect" class="toggle" checked/>
          </div>

          <div class="control-group control-group--full">
            <span class="control-label">Quick scale</span>
            <div class="percent-buttons">
              <button type="button" class="btn btn--secondary btn--sm" data-percent="25">25%</button>
              <button type="button" class="btn btn--secondary btn--sm" data-percent="50">50%</button>
              <button type="button" class="btn btn--secondary btn--sm" data-percent="75">75%</button>
              <button type="button" class="btn btn--secondary btn--sm" data-percent="100">100%</button>
            </div>
          </div>

          <div class="control-group">
            <label for="formatSelect" class="control-label">Output format</label>
            <select id="formatSelect" class="number-input">
              <option value="image/png">PNG</option>
              <option value="image/jpeg">JPEG</option>
              <option value="image/webp">WebP</option>
            </select>
          </div>
          <div class="control-group" id="qualityGroup" hidden>
            <label for="qualityInput" class="control-label">
              Quality
              <span class="control-value" id="qualityValue">80</span>
            </label>
            <input type="range" id="qualityInput" min="1" max="100" value="80" class="slider"/>
          </div>
        </section>

        <div class="actions">
          <button class="btn btn--primary" id="resizeBtn">Resize</button>
        </div>

        <section class="result" id="result" hidden>
          <img class="preview__img" id="resultPreview" alt="Resized image preview"/>
          <div class="preview__meta">
            <span id="resultDims"></span>
            <span id="resultSize"></span>
          </div>
          <a class="btn btn--primary" id="downloadLink" download>Download</a>
        </section>
      </section>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
