<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Markdown Preview — Webtools</title>
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body>
    <div class="app">
      <a class="back-link" href="../">&larr; Webtools</a>
      <header class="header">
        <h1>Markdown Preview</h1>
        <p class="subtitle">Write Markdown and see the rendered preview update live.</p>
      </header>

      <section class="panel">
        <div class="field">
          <div class="field__head">
            <label for="editor" class="control-label">Markdown</label>
          </div>
          <textarea id="editor" class="textarea" rows="20" placeholder="Write Markdown here&hellip;"></textarea>
        </div>

        <div class="field">
          <div class="field__head">
            <label class="control-label">Preview</label>
            <button class="btn btn--secondary btn--sm" id="copyBtn">Copy HTML</button>
          </div>
          <div id="preview" class="preview"></div>
        </div>
      </section>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
