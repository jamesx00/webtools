<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>UUID Generator — Webtools</title>
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body>
    <div class="app">
      <a class="back-link" href="../">&larr; Webtools</a>
      <header class="header">
        <h1>UUID Generator</h1>
        <p class="subtitle">Generate RFC 4122 v4 UUIDs, one or many at a time.</p>
      </header>

      <section class="panel">
        <div class="controls">
          <div class="control-group">
            <label for="quantity" class="control-label">Quantity</label>
            <input type="number" id="quantity" min="1" max="1000" value="1" class="number-input"/>
          </div>
          <div class="control-group control-group--inline">
            <label for="uppercase" class="control-label">Uppercase</label>
            <input type="checkbox" id="uppercase" class="toggle"/>
          </div>
          <div class="control-group control-group--inline">
            <label for="hyphens" class="control-label">Hyphens</label>
            <input type="checkbox" id="hyphens" class="toggle" checked/>
          </div>
        </div>

        <div class="actions">
          <button class="btn btn--primary" id="generateBtn">Generate</button>
        </div>

        <div class="field">
          <div class="field__head">
            <label for="output" class="control-label">Output</label>
            <button class="btn btn--secondary btn--sm" id="copyAllBtn">Copy All</button>
          </div>
          <textarea id="output" class="textarea" rows="10" readonly placeholder="Generated UUIDs appear here&hellip;"></textarea>
        </div>

        <ul class="uuid-list" id="uuidList"></ul>
      </section>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
